name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rivet-windows-x64
          path: |
            dist/rivet-v*-windows-x64.zip
            dist/SHA256SUMS
            dist/rv.exe
            dist/rv-shim.exe
            dist/install.ps1
          if-no-files-found: error
      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = Get-ChildItem "dist/rivet-v*-windows-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "release zip not found" }
          $assets = @($zip.FullName, "dist/rv.exe", "dist/rv-shim.exe", "dist/install.ps1", "dist/SHA256SUMS")
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @("release", "create", $tag, "--draft", "--title", "Rivet $tag", "--notes-file", "dist/README.md")
            if ($tag -match "-") { $createArgs += "--prerelease" }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
