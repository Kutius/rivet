name: Catalog verify

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked --release --bins

      - name: Install and smoke test shard ${{ matrix.shard }}
        shell: pwsh
        run: .\scripts\verify-catalog.ps1 -Root repo/main -ShardIndex ${{ matrix.shard }} -ShardCount 4
