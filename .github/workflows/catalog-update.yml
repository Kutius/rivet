name: Catalog update

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - master
    paths:
      - "repo/main/sources.toml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --bins

      - name: Update and sign catalog
        id: update
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RIVET_SIGNING_KEY_B64: ${{ secrets.RIVET_SIGNING_KEY_B64 }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "rivet-signing.key"
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:RIVET_SIGNING_KEY_B64))
          try {
            & .\target\release\rv-repo.exe sync repo/main --allow-failures
            if ($LASTEXITCODE -ne 0) { throw "catalog sync failed" }
            & .\target\release\rv-repo.exe update repo/main --concurrency 8 --allow-failures --failures-out failed-packages.txt
            if ($LASTEXITCODE -ne 0) { throw "catalog update failed" }
            $changed = @(git ls-files --others --modified --exclude-standard -- repo/main/packages)
            if ($changed.Count -eq 0) { Write-Host "catalog is up to date"; exit 0 }
            & .\target\release\rv-repo.exe sign repo/main --key $keyPath
            if ($LASTEXITCODE -ne 0) { throw "catalog signing failed" }
            "changed=$($changed.Count)" >> $env:GITHUB_OUTPUT
            $changed | Set-Content -Path changed-packages.txt -Encoding utf8
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke install changed packages
        if: steps.update.outputs.changed != ''
        shell: pwsh
        run: |
          $changed = Get-Content changed-packages.txt | ForEach-Object {
            $text = Get-Content $_ -Raw
            [regex]::Match($text, '(?m)^name\s*=\s*"([^"]+)"').Groups[1].Value
          } | Sort-Object -Unique
          $root = Join-Path $env:RUNNER_TEMP "rivet-catalog-smoke"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          $env:RIVET_ROOT = $root
          $env:RIVET_MAIN_INDEX = (Resolve-Path "repo/main/index.json").Path
          $env:RIVET_FONT_DIR = Join-Path $root "fonts"
          $env:RIVET_FONT_REGISTRY = "Software\Rivet\CatalogSmoke\" + [guid]::NewGuid().ToString("N")
          & .\target\release\rv.exe update
          if ($LASTEXITCODE -ne 0) { throw "smoke update failed" }
          & .\target\release\rv.exe install @changed
          if ($LASTEXITCODE -ne 0) { throw "smoke install failed" }
          & .\target\release\rv.exe verify
          if ($LASTEXITCODE -ne 0) { throw "smoke verify failed" }

      - name: Commit and push
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/main/packages repo/main/index.json repo/main/index.json.sig
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -eq 0) { Write-Host "no changes"; exit 0 }
          $message = "Update catalog"
          if (Test-Path changed-packages.txt) {
            $names = Get-Content changed-packages.txt | ForEach-Object { [IO.Path]::GetFileNameWithoutExtension($_) }
            $message = "Update catalog: " + ($names -join ", ")
          }
          git commit -m $message
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
          git pull --rebase origin master
          if ($LASTEXITCODE -ne 0) { throw "git pull failed" }
          git push origin master
          if ($LASTEXITCODE -ne 0) { throw "git push failed" }

      - name: Report or clear update failures
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "Catalog update failures"
          $failures = if (Test-Path failed-packages.txt) { [IO.File]::ReadAllText((Resolve-Path failed-packages.txt)).Trim() } else { "" }
          $existing = gh issue list --state open --search "in:title `"$title`"" --json number,title | ConvertFrom-Json | Where-Object { $_.title -eq $title } | Select-Object -First 1
          if ($failures) {
            $body = "The scheduled catalog update completed with partial failures (successful packages were still published):`n`n$failures`n`nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if ($existing) {
              gh issue edit $existing.number --body $body
            } else {
              gh issue create --title $title --body $body
            }
          } elseif ($existing) {
            gh issue close $existing.number --comment "All catalog packages updated cleanly in run ${{ github.run_id }}."
          }
