# Candidate GitHub repositories for the main catalog.
#
# rv-repo sync adds every repository that has no manifest yet. Existing
# manifests are matched by their GitHub release URL and skipped.
#
# Compact form:
#   repositories = ["owner/repo", ...]
#
# Per-package overrides when auto-detection needs help:
#   [[source]]
#   repository = "owner/repo"
#   name = "package-name"
#   asset = "release-asset-substring"
#   bin = "path/inside/archive.exe"

repositories = [
  # Already published
  "BurntSushi/ripgrep",
  "sharkdp/fd",
  "sharkdp/bat",
  "jqlang/jq",
  "junegunn/fzf",
  "dandavison/delta",
  "mikefarah/yq",
  "ajeetdsouza/zoxide",
  "sharkdp/hyperfine",
  "bootandy/dust",
  "ClementTsang/bottom",
  "casey/just",
  "starship/starship",
  "ducaale/xh",
  "chmln/sd",
  "dalance/procs",
  "eza-community/eza",
  "lsd-rs/lsd",
  "watchexec/watchexec",
  "typst/typst",

  # Batch 1: small, portable CLIs with Windows x64 release archives
  "sharkdp/hexyl",
  "BurntSushi/xsv",
  "TomWright/dasel",
  "itchyny/gojq",
  "johnkerl/miller",
  "wader/fq",
  "duckdb/duckdb",
  "jgm/pandoc",
  "rust-lang/mdBook",

  # Batch 2: developer tooling
  "cargo-bins/cargo-binstall",
  "EmbarkStudios/cargo-deny",
  "dprint/dprint",
  "biomejs/biome",
  "denoland/deno",
  "oven-sh/bun",
  "pnpm/pnpm",
  "astral-sh/uv",
  "astral-sh/ruff",
  "go-task/task",
  "mvdan/sh",
  "mvdan/gofumpt",
  "golangci/golangci-lint",
  "air-verse/air",
  "jesseduffield/lazygit",
  "jesseduffield/lazydocker",

  # Batch 3: infrastructure and operations
  "git-lfs/git-lfs",
  "rclone/rclone",
  "restic/restic",

  # Batch 4: code analysis, git, security, and terminal utilities
  "boyter/scc",
  "Wilfred/difftastic",
  "rhysd/actionlint",
  "gitleaks/gitleaks",
  "orhun/git-cliff",
  "ast-grep/ast-grep",
  "crate-ci/typos",
  "charmbracelet/glow",
  "charmbracelet/gum",
  "muesli/duf",
  "tealdeer-rs/tealdeer",
  "zyedidia/micro",
  "jdx/mise",
  "tree-sitter/tree-sitter",
  "yt-dlp/yt-dlp",

  # Batch 5: cloud, containers, APIs, and databases
  "derailed/k9s",
  "getsops/sops",
  "FiloSottile/age",
  "caddyserver/caddy",
  "cloudflare/cloudflared",
  "hadolint/hadolint",
  "fullstorydev/grpcurl",
  "bufbuild/buf",
  "sqlc-dev/sqlc",
  "amacneil/dbmate",
  "wagoodman/dive",
]

# Per-package overrides (name, asset, bin, or smoke-test args).
[[source]]
repository = "cli/cli"
name = "gh"

[[source]]
repository = "mvdan/sh"
name = "shfmt"

[[source]]
repository = "nushell/nushell"
bin = "nu.exe"

[[source]]
repository = "atuinsh/atuin"
asset = "atuin-x86_64-pc-windows-msvc.zip"

[[source]]
repository = "dotenvx/dotenvx"
asset = "dotenvx-windows-amd64.zip"

[[source]]
repository = "rhysd/actionlint"
test_args = ["-version"]

[[source]]
repository = "gitleaks/gitleaks"
test_args = ["version"]

[[source]]
repository = "derailed/k9s"
test_args = ["version", "--short"]

[[source]]
repository = "caddyserver/caddy"
test_args = ["version"]

[[source]]
repository = "sqlc-dev/sqlc"
test_args = ["version"]

[[source]]
repository = "fullstorydev/grpcurl"
test_args = ["-version"]
